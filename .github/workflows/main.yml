name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *' # daily rebuild to pull in new RSS feed posts
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: echo "checkpoint64.com" > dist/CNAME
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            pr-preview/
      # Tell Bing/Yandex/Naver/Seznam what just shipped. The key file is public by
      # design (static/<key>.txt proves ownership), so it is not a secret. Never
      # fail a deploy over a search-engine ping — and expect HTTP 403 on the very
      # first run, since the key file only goes live in this same deploy.
      # ponytail: resubmits all ~50 sitemap URLs every deploy, changed or not.
      # If that ever draws a quota complaint, diff dist/sitemap.xml against the
      # live one and send only the new/changed <loc>s.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          KEY=513c6980b4f941fbae2142a036a79b65
          grep -oP '(?<=<loc>)[^<]+' dist/sitemap.xml |
            jq -Rn --arg key "$KEY" '{host:"checkpoint64.com",key:$key,keyLocation:"https://checkpoint64.com/\($key).txt",urlList:[inputs]}' > indexnow.json
          cat indexnow.json
          curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json' -d @indexnow.json -w 'HTTP %{http_code}\n'
